<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Detail | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/phosphor-icons"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3faff;
            line-height: 1.6;
            overflow-x: hidden;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5vw;
        }
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: -0.05em;
            text-decoration: none;
            color: inherit;
        }
        .nav-icon {
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            border: 2px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .nav-links {
            display: flex;
            gap: 2.5rem;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .nav-links a {
            text-decoration: none;
            color: inherit;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 5vw;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 3rem;
            margin-top: 1rem;
        }
        .header-left {
            flex: 1;
        }
        .back-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 2rem;
            text-decoration: none;
            color: inherit;
            transition: opacity 0.3s;
        }
        .back-link:hover {
            opacity: 0.6;
        }
        .page-title {
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: -0.01em;
            margin-bottom: 1rem;
            text-transform: uppercase;
            word-break: break-word;
            white-space: nowrap;
        }
        .page-title br {
            display: none;
        }
        .page-subtitle {
            font-size: 1rem;
            color: #666;
            margin-bottom: 1.5rem;
        }
        .pill-group {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .pill {
            display: inline-block;
            padding: 0.375rem 0.875rem;
            background: #f0f0f0;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .pill:nth-child(1) { background: #fce7f3; color: #be185d; }
        .pill:nth-child(2) { background: #dbeafe; color: #1e40af; }
        .pill:nth-child(3) { background: #dcfce7; color: #15803d; }
        .pill:nth-child(4) { background: #fef3c7; color: #b45309; }
        .pill:nth-child(5) { background: #e9d5ff; color: #6b21a8; }
        .pill:nth-child(6) { background: #cffafe; color: #0369a1; }
        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 1rem;
        }
        .number-big {
            font-size: 7rem;
            font-weight: 900;
            line-height: 0.8;
            color: #000;
        }
        .icon-circle {
            width: 4rem;
            height: 4rem;
            border-radius: 50%;
            border: 2px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 1.5rem;
        }
        .hero-section {
            width: 100%;
            background: white;
            border-radius: 2.5rem;
            display: block;
            padding: 2rem;
            margin-bottom: 4rem;
            position: relative;
            overflow: hidden;
        }
        .chart-title {
            font-size: 1rem;
            font-weight: 700;
            color: #666;
            margin-bottom: 0.5rem;
        }
        .chart-desc {
            font-size: 0.85rem;
            color: #888;
            margin-top: 0.75rem;
            text-align: left;
        }
        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 3rem;
            margin-bottom: 4rem;
        }
        .brief-section h3 {
            font-size: 0.75rem;
            font-weight: 700;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 1rem;
        }
        .brief-text {
            font-size: 1.875rem;
            font-weight: 300;
            line-height: 1.625;
            color: #333;
            margin-bottom: 2rem;
        }
        .brief-secondary {
            font-size: 1.125rem;
            color: #666;
            line-height: 1.75;
        }
        .meta-section {
            padding-top: 2rem;
        }
        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            margin-bottom: 2rem;
        }
        .meta-label {
            font-size: 0.65rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 500;
        }
        .meta-value {
            font-size: 0.9rem;
            color: #333;
            font-weight: 600;
            line-height: 1.6;
        }
        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 3rem;
            font-size: 0.9rem;
        }
        .info-table td {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid #e0e0e0;
        }
        .info-table td:first-child {
            font-weight: 600;
            color: #555;
            width: 120px;
            vertical-align: top;
        }
        .info-table tr:last-child td {
            border-bottom: none;
        }
        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }
        .tech-tag {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            background: #f5f5f5;
            border-radius: 3px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #666;
        }
        .links-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #e0e0e0;
        }
        .project-link {
            display: inline-block;
            padding: 0.625rem 1.25rem;
            margin: 0.5rem 1rem 0.5rem 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-decoration: none;
            color: #333;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .project-link:hover {
            background: #f9f9f9;
            border-color: #000;
        }
        .key-details {
            margin-bottom: 6rem;
        }
        .key-details h2 {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }
        .key-details > p {
            font-size: 1rem;
            color: #555;
            line-height: 1.75;
            margin-bottom: 1.5rem;
        }
        .key-details ul {
            margin-left: 1.5rem;
            color: #555;
            line-height: 1.8;
        }
        .key-details li {
            margin-bottom: 0.5rem;
        }
        .footer {
            margin-top: 6rem;
            padding: 4rem 0;
            text-align: center;
            border-top: 1px solid #e0e0e0;
        }
        .footer-logo {
            width: 3rem;
            height: 3rem;
            border: 2px solid #bbb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            color: #bbb;
            font-size: 1.25rem;
        }
        @media (max-width: 900px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
            .page-title {
                font-size: 3rem;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-right {
                align-items: flex-start;
                margin-top: 2rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a class="nav-logo" href="index.html">
            <div class="nav-icon">
                <i class="ph-asterisk" style="font-size: 0.9rem;"></i>
            </div>
            Yunkyung Song Portfolio
        </a>
        <div class="nav-links">
            <a href="index.html#projects">PROJECTS</a>
            <a href="index.html#activities">ACTIVITIES</a>
            <a href="index.html#skills">SKILLS</a>
            <a href="index.html#contact">CONTACT</a>
        </div>
    </nav>

    <main>
        <div class="header">
            <div class="header-left">
                <a class="back-link" href="index.html#projects">
                    <i class="ph-arrow-left"></i>
                    BACK TO PROJECTS
                </a>
                <h1 class="page-title" id="pageTitle"></h1>
                <p class="page-subtitle" id="pageSubtitle"></p>
                <div class="pill-group" id="pillGroup"></div>
            </div>
            <div class="header-right">
                <div class="number-big" id="projectNumber"></div>
                <div class="icon-circle">
                    <i class="ph-circles-three"></i>
                </div>
            </div>
        </div>

        <div class="hero-section" id="heroSection" style="display:none; padding: 1.5rem;">
            <h3 class="chart-title" id="chartTitle"></h3>
            <div id="chartContainer" style="display:none;">
                <canvas id="projectChart" height="140"></canvas>
            </div>
            <div id="erdContainer" style="display:none; overflow-x: auto;">
                <svg id="erdSvg"></svg>
            </div>
            <div id="galleryContainer" style="display:none;">
                <div id="galleryImages" style="display:flex; gap:0.75rem; flex-wrap:wrap;"></div>
            </div>
            <p class="chart-desc" id="chartDesc"></p>
        </div>

        <div class="content-grid" id="contentGrid">
            <div class="brief-section">
                <h3>Overview</h3>
                <p class="brief-text" id="briefText"></p>
                <p class="brief-secondary" id="briefDescription"></p>
            </div>

            <div class="meta-section">
                <table class="info-table" id="infoTable"></table>

                <div class="links-section" id="linksSection">
                    <p style="font-size: 0.85rem; color: #999; margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;">Links</p>
                    <div id="linksContainer"></div>
                </div>
            </div>
        </div>

        <div id="projectsListSection" style="display:none; margin-bottom: 4rem;">
            <h2 style="font-size: 1.5rem; font-weight: 900; letter-spacing: -0.02em; margin-bottom: 2rem; text-transform: uppercase;">Personal Projects</h2>
            <div id="projectsList" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem;"></div>
        </div>

        <div class="key-details" id="keyDetails"></div>

        <div style="background: #000; color: white; padding: 3rem; border-radius: 2rem; display: flex; justify-content: space-between; align-items: center; margin-top: 6rem; cursor: pointer; transition: opacity 0.3s;" onclick="goToNextProject()" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">
            <div>
                <h3 style="font-size: 2rem; font-weight: 700; margin: 0 0 0.5rem 0;">Next Project</h3>
                <span style="color: #aaa; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.9rem;" id="nextProjectName">Loading...</span>
            </div>
            <div style="width: 4rem; height: 4rem; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center;">
                <i class="ph-arrow-right" style="font-size: 2rem;"></i>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-logo">
            <i class="ph-circles-three"></i>
        </div>
    </footer>

    <script>
        function loadActivityImages(projectId) {
            fetch('index.html')
                .then(response => response.text())
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');

                    let modal = null;
                    if (projectId === 'act1') {
                        modal = doc.getElementById('modal-act1');
                    } else if (projectId === 'act2') {
                        modal = doc.getElementById('modal-act2');
                    }

                    if (modal) {
                        const activityImgs = modal.querySelector('.activity-imgs');
                        if (activityImgs) {
                            const galleryContainer = document.getElementById('galleryImages');
                            galleryContainer.innerHTML = activityImgs.innerHTML;
                        }
                    }
                })
                .catch(error => console.log('Error loading images:', error));
        }

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        async function loadProject() {
            const projectId = getQueryParam('id') || 'proj1';

            try {
                // Load project data
                const dataScript = document.createElement('script');
                dataScript.src = `data/${projectId}.js`;
                document.head.appendChild(dataScript);

                dataScript.onload = function() {
                    renderProject();
                };
            } catch (error) {
                console.error('Error loading project:', error);
            }
        }

        function renderProject() {
            if (typeof projectData === 'undefined') return;

            const data = projectData;

            // Page title & subtitle
            document.getElementById('pageTitle').innerHTML = data.title;
            document.getElementById('pageSubtitle').textContent = data.subtitle;
            document.getElementById('projectNumber').textContent = data.number;

            // Pills
            const pillGroup = document.getElementById('pillGroup');
            data.pills.forEach(pill => {
                const pillEl = document.createElement('div');
                pillEl.className = 'pill';
                pillEl.textContent = pill;
                pillGroup.appendChild(pillEl);
            });

            // Personal Projects Special Handling
            if (data.id === 'personal-projects' && data.projects) {
                document.getElementById('contentGrid').style.display = 'none';
                document.getElementById('projectsListSection').style.display = 'block';
                document.getElementById('keyDetails').style.display = 'none';

                const projectsList = document.getElementById('projectsList');
                data.projects.forEach(project => {
                    const projectCard = document.createElement('div');
                    projectCard.style.cssText = `
                        background: white;
                        padding: 1.5rem;
                        border-radius: 0.75rem;
                        border: 1px solid #e0e0e0;
                        display: flex;
                        flex-direction: column;
                        gap: 1rem;
                        transition: all 0.3s;
                    `;
                    projectCard.onmouseover = () => projectCard.style.boxShadow = '0 8px 24px rgba(0,0,0,0.1)';
                    projectCard.onmouseout = () => projectCard.style.boxShadow = 'none';

                    const tagsHtml = project.tags.map(tag => `<span class="tech-tag">${tag}</span>`).join('');
                    projectCard.innerHTML = `
                        <div>
                            <h3 style="font-size: 1.125rem; font-weight: 700; margin: 0 0 0.5rem 0;">${project.title}</h3>
                            <p style="font-size: 0.85rem; color: #666; margin: 0 0 1rem 0;">${project.subtitle}</p>
                            <p style="font-size: 0.95rem; color: #555; line-height: 1.6; margin: 0 0 1rem 0;">${project.description}</p>
                        </div>
                        <div class="tech-tags">${tagsHtml}</div>
                        <a href="${project.github}" target="_blank" class="project-link" style="margin: 0;">GitHub</a>
                    `;
                    projectsList.appendChild(projectCard);
                });
            } else {
                // Overview
                document.getElementById('briefText').textContent = data.overview.brief;
                document.getElementById('briefDescription').innerHTML = data.overview.description;

                // Meta info table
                const table = document.getElementById('infoTable');
                data.metaInfo.forEach(item => {
                const tr = document.createElement('tr');
                const td1 = document.createElement('td');
                td1.innerHTML = `<strong>${item.label}</strong>`;
                const td2 = document.createElement('td');

                if (item.tags) {
                    const tagsHtml = item.tags.map(tag => `<span class="tech-tag">${tag}</span>`).join('');
                    td2.innerHTML = `<div class="tech-tags">${tagsHtml}</div>`;
                } else {
                    td2.innerHTML = item.value;
                }

                tr.appendChild(td1);
                tr.appendChild(td2);
                table.appendChild(tr);
                });

                // Links
                const linksContainer = document.getElementById('linksContainer');
                data.links.forEach(link => {
                    const a = document.createElement('a');
                    a.href = link.url;
                    a.target = '_blank';
                    a.className = 'project-link';
                    a.textContent = link.text;
                    linksContainer.appendChild(a);
                });

                // Chart
                if (data.chart.type && data.chart.type !== 'none') {
                    document.getElementById('heroSection').style.display = 'block';
                    document.getElementById('chartTitle').textContent = data.chart.title;
                    document.getElementById('chartDesc').textContent = data.chart.desc;

                    if (data.chart.type === 'threshold') {
                        document.getElementById('chartContainer').style.display = 'block';
                        const chartScript = document.createElement('script');
                        chartScript.src = `data/charts/${data.id}-threshold.js`;
                        document.head.appendChild(chartScript);

                        chartScript.onload = function() {
                            if (typeof drawThresholdChart !== 'undefined') {
                                drawThresholdChart();
                            }
                        };
                    } else if (data.chart.type === 'erd' && data.chart.svg) {
                        document.getElementById('erdContainer').style.display = 'block';
                        document.getElementById('erdSvg').outerHTML = data.chart.svg;
                    } else if (data.chart.type === 'gallery' && data.hasImages) {
                        document.getElementById('galleryContainer').style.display = 'block';
                        loadActivityImages(data.id);
                    }
                }

                // Key details
                const keyDetailsEl = document.getElementById('keyDetails');
                keyDetailsEl.innerHTML = `
                    <h2>Key Implementation Details</h2>
                    <p>${data.keyDetails}</p>
                    <ul>
                        ${data.keyPoints.map(point => `<li>${point}</li>`).join('')}
                    </ul>
                `;
            }

            document.title = `${data.title.replace(/<br>/g, ' ')} | Portfolio`;
        }

        // Load project on page load
        document.addEventListener('DOMContentLoaded', loadProject);

        // Next project navigation
        const projectSequence = ['proj1', 'proj2', 'act1', 'act2', 'act3', 'act4', 'comp1'];
        const projectNames = {
            'proj1': 'XAI 기반 SaaS',
            'proj2': 'Car Park Search',
            'act1': 'Wi-Fi Multi-AP',
            'act2': 'R&D KIRD',
            'act3': '융합보안 학술동아리',
            'act4': 'SK Networks Family AI 캠프',
            'comp1': '인공지능 루키'
        };

        function goToNextProject() {
            const urlParams = new URLSearchParams(window.location.search);
            const currentId = urlParams.get('id');
            const currentIndex = projectSequence.indexOf(currentId);

            if (currentIndex !== -1 && currentIndex < projectSequence.length - 1) {
                const nextId = projectSequence[currentIndex + 1];
                window.location.href = `detail.html?id=${nextId}`;
            } else {
                window.location.href = 'index.html';
            }
        }

        function updateNextProjectName() {
            const urlParams = new URLSearchParams(window.location.search);
            const currentId = urlParams.get('id');
            const currentIndex = projectSequence.indexOf(currentId);

            if (currentIndex !== -1 && currentIndex < projectSequence.length - 1) {
                const nextId = projectSequence[currentIndex + 1];
                const nameEl = document.getElementById('nextProjectName');
                if (nameEl) {
                    nameEl.textContent = projectNames[nextId];
                }
            } else {
                const nameEl = document.getElementById('nextProjectName');
                if (nameEl) {
                    nameEl.textContent = 'Back to Home';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', updateNextProjectName);
    </script>
</body>
</html>
