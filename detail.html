            text-align: left;

            font-size: 0.72rem;

            color: #222;

        }

        .dv-table .num {
            text-align: right;

        .dv-table th.num {
            text-align: right;
        }
        /* 강조 행 (결론이 되는 값) */
        .dv-table tr.peak td {
            background: #f2f7ff;
            color: #17408b;

            color: #17408b;

        /* ── 강조 박스 (캐릭터 카드·인용 등) ── */

            padding: 1.5rem 1.75rem;

            border-left: 3px solid #2563eb;

        }

            font-weight: 700;

            letter-spacing: 0.04em;

            padding-top: 1.25rem;
            border-top: 1px solid #eef1f5;

        .section-body .callout p {
            margin: 0 0 0.9rem;
            font-size: 0.9rem;
            line-height: 1.75;
            color: #5a626e;
        }
        .section-body .callout p:last-child {
            margin-bottom: 0;
        }
        .section-body .callout strong {

        .dv-table tr.alert td {

        .section-body .muted {

    <script>
        function loadActivityImages(projectId) {
            fetch('index.html')
                .then(response => response.text())
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');

                    let modal = null;
                    if (projectId === '3-wifi-multiap') {
                        modal = doc.getElementById('modal-3-wifi-multiap');
                    } else if (projectId === '4-kird-challenge') {
                        modal = doc.getElementById('modal-4-kird-challenge');
                    }

                    if (modal) {
                        const activityImgs = modal.querySelector('.activity-imgs');
                        if (activityImgs) {
                            const galleryContainer = document.getElementById('galleryImages');
                            galleryContainer.innerHTML = activityImgs.innerHTML;
                        }
                    }
                })
                .catch(error => console.log('Error loading images:', error));
        }

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        async function loadProject() {
            const projectId = getQueryParam('id') || '1-xai-saas';

            try {
                // Load project data
                const dataScript = document.createElement('script');
                dataScript.src = `data/${projectId}.js`;
                document.head.appendChild(dataScript);

                dataScript.onload = function() {
                    renderProject();
                };
            } catch (error) {
                console.error('Error loading project:', error);
            }
        }

        function renderProject() {
            if (typeof projectData === 'undefined') return;

            const data = projectData;

            // Research & Activities · Competition & Personal 은 사이드 컬럼을 좁게
            const NARROW_META_IDS = [
                '3-wifi-multiap', '4-kird-challenge', '5-cybersecurity-club', '6-sk-aicamp',
                '7-ai-rookie', '10-madi-club',
                'personal-app', 'personal-hand', 'personal-sqld', 'personal-idea', 'personal-bubble'
            ];
            if (NARROW_META_IDS.indexOf(data.id) !== -1) {
                document.body.classList.add('layout-narrow-meta');
            }

            // Page title & subtitle
            document.getElementById('pageTitle').innerHTML = data.title;
            document.getElementById('pageSubtitle').textContent = data.subtitle;

            // Number or Icon
            if (data.icon) {
                if (data.icon.includes('.png') || data.icon.includes('.jpg') || data.icon.includes('.svg')) {
                    document.getElementById('projectNumber').innerHTML = `<img src="${data.icon}" style="width: 7rem; height: 7rem; object-fit: contain;">`;
                } else {
                    document.getElementById('projectNumber').innerHTML = `<i class="${data.icon}" style="font-size: 4rem; color: #f472b6;"></i>`;
                }
            } else {
                document.getElementById('projectNumber').textContent = data.number;
            }

            // Pills
            const pillGroup = document.getElementById('pillGroup');
            data.pills.forEach(pill => {
                const pillEl = document.createElement('div');
                pillEl.className = 'pill';
                pillEl.textContent = pill;
                pillGroup.appendChild(pillEl);
            });

            // Personal Projects Special Handling
            if (data.id === 'personal-projects' && data.projects) {
                document.getElementById('contentGrid').style.display = 'none';
                document.getElementById('projectsListSection').style.display = 'block';
                document.getElementById('keyDetails').style.display = 'none';

                const projectsList = document.getElementById('projectsList');
                data.projects.forEach(project => {
                    const projectCard = document.createElement('div');
                    projectCard.style.cssText = `
                        background: white;
                        padding: 1.5rem;
                        border-radius: 0.75rem;
                        border: 1px solid #e0e0e0;
                        display: flex;
                        flex-direction: column;
                        gap: 1rem;
                        transition: all 0.3s;
                    `;
                    projectCard.onmouseover = () => projectCard.style.boxShadow = '0 8px 24px rgba(0,0,0,0.1)';
                    projectCard.onmouseout = () => projectCard.style.boxShadow = 'none';

                    const tagsHtml = project.tags.map(tag => `<span class="tech-tag">${tag}</span>`).join('');
                    projectCard.innerHTML = `
                        <div>
                            <h3 style="font-size: 1.125rem; font-weight: 700; margin: 0 0 0.5rem 0;">${project.title}</h3>
                            <p style="font-size: 0.85rem; color: #666; margin: 0 0 1rem 0;">${project.subtitle}</p>
                            <p style="font-size: 0.95rem; color: #555; line-height: 1.6; margin: 0 0 1rem 0;">${project.description}</p>
                        </div>
                        <div class="tech-tags">${tagsHtml}</div>
                        <a href="${project.github}" target="_blank" class="project-link" style="margin: 0;">GitHub</a>
                    `;
                    projectsList.appendChild(projectCard);
                });
            } else {
                // Overview
                document.getElementById('briefText').textContent = data.overview.brief;
                document.getElementById('briefDescription').innerHTML = data.overview.description;

                // Meta info table
                const table = document.getElementById('infoTable');
                data.metaInfo.forEach(item => {
                const tr = document.createElement('tr');
                const td1 = document.createElement('td');
                td1.innerHTML = `<strong>${item.label}</strong>`;
                const td2 = document.createElement('td');

                if (item.tags) {
                    const tagsHtml = item.tags.map(tag => `<span class="tech-tag">${tag}</span>`).join('');
                    td2.innerHTML = `<div class="tech-tags">${tagsHtml}</div>`;
                } else {
                    td2.innerHTML = item.value;
                }

                tr.appendChild(td1);
                tr.appendChild(td2);
                table.appendChild(tr);
                });

                // Links
                const linksContainer = document.getElementById('linksContainer');
                data.links.forEach(link => {
                    const a = document.createElement('a');
                    a.href = link.url;
                    a.target = '_blank';
                    a.className = 'project-link';
                    a.textContent = link.text;
                    linksContainer.appendChild(a);
                });

                // Chart
                if (data.chart.type && data.chart.type !== 'none') {
                    document.getElementById('heroSection').style.display = 'block';
                    document.getElementById('chartTitle').textContent = data.chart.title;
                    document.getElementById('chartDesc').textContent = data.chart.desc;

                    if (data.chart.type === 'threshold') {
                        document.getElementById('chartContainer').style.display = 'block';
                        const chartScript = document.createElement('script');
                        chartScript.src = `data/charts/${data.id}-threshold.js`;
                        document.head.appendChild(chartScript);

                        chartScript.onload = function() {
                            if (typeof drawThresholdChart !== 'undefined') {
                                drawThresholdChart();
                            }
                        };
                    } else if (data.chart.type === 'erd' && data.chart.svg) {
                        document.getElementById('erdContainer').style.display = 'block';
                        document.getElementById('erdSvg').outerHTML = data.chart.svg;
                    } else if (data.chart.type === 'gallery' && data.hasImages) {
                        document.getElementById('galleryContainer').style.display = 'block';
                        loadActivityImages(data.id);
                    } else if (data.chart.type === 'images' && data.chart.images) {
                        const imagesEl = document.getElementById('imagesContainer');
                        imagesEl.style.display = 'grid';
                        if (data.chart.columns) imagesEl.style.gridTemplateColumns = data.chart.columns;
                        if (data.chart.maxWidth) imagesEl.style.maxWidth = data.chart.maxWidth;
                        imagesEl.innerHTML = data.chart.images.map(img => {
                            const src = typeof img === 'string' ? img : img.src;
                            const caption = typeof img === 'string' ? '' : (img.caption || '');
                            return `<figure><img src="${src}" alt="${caption}" loading="lazy">` +
                                   (caption ? `<figcaption>${caption}</figcaption>` : '') +
                                   `</figure>`;
                        }).join('');
                    } else if (data.chart.type === 'video' && data.chart.src) {
                        document.getElementById('videoContainer').style.display = 'block';
                        const video = document.getElementById('projectVideo');
                        const hint = document.getElementById('videoHint');
                        video.src = data.chart.src;
                        if (data.chart.poster) video.poster = data.chart.poster;

                        // 소리를 켜면 안내 문구 숨김
                        video.addEventListener('volumechange', function() {
                            if (!video.muted && hint) hint.style.display = 'none';
                        });

                        // 브라우저가 자동재생을 막은 경우 안내 문구 교체
                        const played = video.play();
                        if (played && typeof played.catch === 'function') {
                            played.catch(function() {
                                if (hint) hint.textContent = '재생 버튼을 눌러 데모를 확인하세요';
                            });
                        }
                    }
                }

                // Background
                if (data.background && data.background.content) {
                    const bgEl = document.getElementById('backgroundSection');
                    bgEl.style.display = 'block';
                    bgEl.innerHTML = `
                        <h2>${data.background.title || 'Background'}</h2>
                        <div class="section-body">${data.background.content}</div>
                    `;
                }

                // Key details
                const keyDetailsEl = document.getElementById('keyDetails');
                keyDetailsEl.innerHTML = `
                    <h2>Key Implementation Details</h2>
                    <div class="section-body">${data.keyDetails}</div>
                    <ul>
                        ${data.keyPoints.map(point => `<li>${point}</li>`).join('')}
                    </ul>
                `;

                // Demo video (Key Details 아래) — 스크롤 진입 시 로드·재생
                if (data.demo && data.demo.src) {
                    const demoEl = document.getElementById('demoSection');
                    demoEl.style.display = 'block';
                    demoEl.innerHTML = `
                        <h2>${data.demo.title || 'Demo'}</h2>
                        ${data.demo.desc ? `<p class="demo-desc">${data.demo.desc}</p>` : ''}
                        <div class="demo-frame">
                            <video id="demoVideo" class="project-video" controls muted loop playsinline preload="none"></video>
                            <p class="video-hint" id="demoHint">화면에 들어오면 음소거로 자동 재생됩니다 — 소리는 <strong>🔊</strong> 로 켜주세요</p>
                        </div>
                    `;

                    const demoVideo = document.getElementById('demoVideo');
                    const demoHint = document.getElementById('demoHint');
                    if (data.demo.poster) demoVideo.poster = data.demo.poster;

                    demoVideo.addEventListener('volumechange', function() {
                        if (!demoVideo.muted && demoHint) demoHint.style.display = 'none';
                    });

                    if ('IntersectionObserver' in window) {
                        const io = new IntersectionObserver(function(entries) {
                            entries.forEach(function(entry) {
                                if (entry.isIntersecting) {
                                    // 처음 보일 때만 다운로드 시작
                                    if (!demoVideo.src) demoVideo.src = data.demo.src;
                                    const p = demoVideo.play();
                                    if (p && typeof p.catch === 'function') {
                                        p.catch(function() {
                                            if (demoHint) demoHint.textContent = '재생 버튼을 눌러 데모를 확인하세요';
                                        });
                                    }
                                } else {
                                    demoVideo.pause();
                                }
                            });
                        }, { threshold: 0.35 });
                        io.observe(demoVideo);
                    } else {
                        demoVideo.src = data.demo.src;
                    }
                }

                // Sections
                if (data.sections && data.sections.length) {
                    const sectionsEl = document.getElementById('detailSections');
                    sectionsEl.style.display = 'block';
                    sectionsEl.innerHTML = `
                        <h2>Deep Dive</h2>
                        ${data.sections.map((section, i) => `
                            <div class="detail-section">
                                <div class="detail-section-num">${String(i + 1).padStart(2, '0')}</div>
                                <div>
                                    <h3>${section.title}</h3>
                                    <div class="section-body">${section.content}</div>
                                </div>
                            </div>
                        `).join('')}
                    `;
                }
            }

            document.title = `${data.title.replace(/<br>/g, ' ')} | Portfolio`;
        }

        // Load project on page load
        document.addEventListener('DOMContentLoaded', loadProject);

        // Next project navigation
        const projectSequence = ['1-xai-saas', '2-carpark-search', '3-wifi-multiap', '4-kird-challenge', '5-cybersecurity-club', '6-sk-aicamp', '7-ai-rookie', '8-law-rag', '9-dear-mate', '10-madi-club'];
        const projectNames = {
            '1-xai-saas': 'XAI 기반 SaaS',
            '2-carpark-search': 'Car Park Search',
            '3-wifi-multiap': 'Wi-Fi Multi-AP',
            '4-kird-challenge': 'R&D KIRD',
            '5-cybersecurity-club': '융합보안 학술동아리',
            '6-sk-aicamp': 'SK Networks Family AI 캠프',
            '7-ai-rookie': '인공지능 루키',
            '8-law-rag': '법률 상담 RAG',
            '9-dear-mate': 'DearMate',
            '10-madi-club': '문화교류연합동아리 MADI'
        };

        function goToNextProject() {
            const urlParams = new URLSearchParams(window.location.search);
            const currentId = urlParams.get('id');
            const currentIndex = projectSequence.indexOf(currentId);

            if (currentIndex !== -1 && currentIndex < projectSequence.length - 1) {
                const nextId = projectSequence[currentIndex + 1];
                window.location.href = `detail.html?id=${nextId}`;
            } else {
                window.location.href = 'personal-projects-detail.html';
            }
        }

        function updateNextProjectName() {
            const urlParams = new URLSearchParams(window.location.search);
            const currentId = urlParams.get('id');
            const currentIndex = projectSequence.indexOf(currentId);

            if (currentIndex !== -1 && currentIndex < projectSequence.length - 1) {
                const nextId = projectSequence[currentIndex + 1];
                const nameEl = document.getElementById('nextProjectName');
                if (nameEl) {
                    nameEl.textContent = projectNames[nextId];
                }
            } else {
                const nameEl = document.getElementById('nextProjectName');
                if (nameEl) {
                    nameEl.textContent = 'Personal Project';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', updateNextProjectName);
    </script>
</body>
</html>
